<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BuildMe — Offline</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f8fafc; color: #0f172a;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center; padding: 24px;
    }
    .card { max-width: 420px; }
    .mark { width: 64px; height: 64px; border-radius: 16px; background: #1e293b; margin: 0 auto 20px;
            display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px; }
    .mark span { display: block; width: 46px; height: 8px; border-radius: 4px; background: #2563eb; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; color: #64748b; margin: 0 0 20px; line-height: 1.5; }
    button {
      background: #2563eb; color: #fff; border: 0; border-radius: 10px;
      padding: 10px 22px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark"><span></span></div>
    <h1>You're offline</h1>
    <p>
      BuildMe needs a connection for live project data — quotations, evidence and
      budgets refresh from the server. Reconnect and the app picks up right where
      you left off.
    </p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
